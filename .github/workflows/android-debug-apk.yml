name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Vérifier les fichiers requis
        shell: bash
        run: |
          set -e
          test -f package.json
          test -f package-lock.json
          test -f capacitor.config.ts
          test -f www/index.html
          test -f www/app.js
          test -f www/lib/leaflet/leaflet.js
          test -f www/lib/leaflet/leaflet.css
          test -f www/icons/rectangle-navigation-bateau.svg
          test -f www/data/export_2.js
          test -f www/data/export_3.js
          test -f www/data/SegmentationMarne_au_RhinMoselle_1.js
          echo "Tous les fichiers requis sont présents."

      - name: Installer les dépendances npm
        run: npm ci

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Préparer www
        run: npm run prepare-www

      - name: Vérifier index.html
        shell: bash
        run: |
          set -e
          grep -Fq 'src="./lib/leaflet/leaflet.js"' www/index.html
          grep -Fq 'src="./data/export_2.js"' www/index.html
          grep -Fq 'src="./data/export_3.js"' www/index.html
          grep -Fq 'src="./data/SegmentationMarne_au_RhinMoselle_1.js"' www/index.html
          grep -Fq 'src="./app.js"' www/index.html
          echo "Références index.html validées."

      - name: Vérifier app.js et SVG
        shell: bash
        run: |
          set -e
          grep -Fq 'rectangle-navigation-bateau' www/app.js
          test -f www/icons/rectangle-navigation-bateau.svg
          echo "app.js et SVG validés."

      - name: Ajouter Android si nécessaire
        shell: bash
        run: |
          set -e
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Vérifier les fichiers Android copiés
        shell: bash
        run: |
          set -e
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/app.js
          test -f android/app/src/main/assets/public/icons/rectangle-navigation-bateau.svg
          test -f android/app/src/main/assets/public/data/export_2.js
          test -f android/app/src/main/assets/public/data/export_3.js
          test -f android/app/src/main/assets/public/data/SegmentationMarne_au_RhinMoselle_1.js
          grep -Fq 'rectangle-navigation-bateau' android/app/src/main/assets/public/app.js
          echo "Ressources Android validées."

      - name: Donner les droits à Gradle
        run: chmod +x android/gradlew

      - name: Compiler l'APK debug
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Vérifier l'APK
        shell: bash
        run: |
          set -e
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: sig-poche-uti-cmre-en-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
