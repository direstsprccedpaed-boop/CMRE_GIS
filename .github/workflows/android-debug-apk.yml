name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  CAPACITOR_ANDROID_DIR: android

jobs:
  build-debug-apk:
    name: Build APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Vérifier les fichiers de configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f capacitor.config.ts
          test -f www/index.html
          test -f www/app.js
          test -f www/lib/leaflet/leaflet.js
          test -f www/lib/leaflet/leaflet.css
          test -f www/icons/rectangle-navigation-bateau.svg
          test -f www/data/export_2.js
          test -f www/data/export_3.js
          test -f www/data/SegmentationMarne_au_RhinMoselle_1.js

      - name: Installer les dépendances npm
        run: npm ci

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Vérifier la préparation du dossier www
        run: npm run prepare-www

      - name: Vérifier les références HTML et le code chargé
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'src="./lib/leaflet/leaflet.js"' www/index.html
          grep -q 'src="./data/export_2.js"' www/index.html
          grep -q 'src="./data/export_3.js"' www/index.html
          grep -q 'src="./data/SegmentationMarne_au_RhinMoselle_1.js"' www/index.html
          grep -q 'src="./app.js"' www/index.html
          grep -q 'rectangle-navigation-bateau' www/app.js
          echo 'Références web validées.'

      - name: Ajouter Android si nécessaire
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${CAPACITOR_ANDROID_DIR}" ]; then
            npx cap add android
          fi

      - name: Synchroniser les ressources web vers Android
        run: npx cap sync android

      - name: Vérifier les ressources copiées dans Android
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_DIR="android/app/src/main/assets/public"
          test -f "$PUBLIC_DIR/index.html"
          test -f "$PUBLIC_DIR/app.js"
          test -f "$PUBLIC_DIR/icons/rectangle-navigation-bateau.svg"
          test -f "$PUBLIC_DIR/data/export_2.js"
          test -f "$PUBLIC_DIR/data/export_3.js"
          test -f "$PUBLIC_DIR/data/SegmentationMarne_au_RhinMoselle_1.js"
          grep -q 'rectangle-navigation-bateau' "$PUBLIC_DIR/app.js"
          echo 'Ressources web correctement copiées dans Android.'

      - name: Préparer Gradle
        shell: bash
        run: chmod +x android/gradlew

      - name: Nettoyer et compiler l'APK debug
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Vérifier l'APK produit
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Publier l'APK debug
        uses: actions/upload-artifact@v4
        with:
          name: sig-poche-uti-cmre-en-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
