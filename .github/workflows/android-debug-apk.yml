name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Check web assets
        shell: bash
        run: |
          set -e
          test -f package.json
          test -f package-lock.json
          test -f capacitor.config.ts
          test -f www/index.html
          test -f www/app.js
          test -f www/lib/leaflet/leaflet.js
          test -f www/lib/leaflet/leaflet.css
          test -f www/icons/rectangle-navigation-bateau.svg
          test -f www/data/export_2.js
          test -f www/data/export_3.js
          test -f www/data/SegmentationMarne_au_RhinMoselle_1.js

      - name: Prepare web directory
        run: npm run prepare-www

      - name: Add Android platform when missing
        shell: bash
        run: |
          set -e
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy web assets explicitly
        run: npx cap copy android

      - name: Verify Android web assets
        shell: bash
        run: |
          set -e
          public=android/app/src/main/assets/public
          test -f "$public/index.html"
          test -f "$public/app.js"
          test -f "$public/icons/rectangle-navigation-bateau.svg"
          test -f "$public/data/export_2.js"
          test -f "$public/data/export_3.js"
          test -f "$public/data/SegmentationMarne_au_RhinMoselle_1.js"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sig-poche-uti-cmre-en-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
