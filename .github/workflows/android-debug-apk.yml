# Fichier à placer dans : .github/workflows/android-debug-apk.yml
name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Installer Java (JDK 17 requis par Gradle/Capacitor)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Préparer le dossier www (assets + données GeoJSON)
        run: npm run prepare-www

      - name: Ajouter la plateforme Android (si absente)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Synchroniser Capacitor -> Android
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK en artefact du workflow
        uses: actions/upload-artifact@v4
        with:
          name: sig-poche-uti-cmre-en-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
