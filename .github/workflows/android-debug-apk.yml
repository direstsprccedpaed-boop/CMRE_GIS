name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Show repository structure
        shell: bash
        run: |
          echo "Contenu de www :"
          ls -la www || echo "www est absent"
          echo
          echo "Contenu de www/data :"
          ls -la www/data || echo "www/data est absent"

      - name: Check web assets
        shell: bash
        run: |
          echo "Verification des fichiers requis :"
          if [ -f package.json ]; then echo "OK package.json"; else echo "ABSENT package.json"; fi
          if [ -f package-lock.json ]; then echo "OK package-lock.json"; else echo "ABSENT package-lock.json"; fi
          if [ -f capacitor.config.ts ]; then echo "OK capacitor.config.ts"; else echo "ABSENT capacitor.config.ts"; fi
          if [ -f www/index.html ]; then echo "OK www/index.html"; else echo "ABSENT www/index.html"; fi
          if [ -f www/app.js ]; then echo "OK www/app.js"; else echo "ABSENT www/app.js"; fi
          if [ -f www/communeResolver.js ]; then echo "OK www/communeResolver.js"; else echo "ABSENT www/communeResolver.js"; fi
          if [ -f www/lib/leaflet/leaflet.js ]; then echo "OK www/lib/leaflet/leaflet.js"; else echo "ABSENT www/lib/leaflet/leaflet.js"; fi
          if [ -f www/lib/leaflet/leaflet.css ]; then echo "OK www/lib/leaflet/leaflet.css"; else echo "ABSENT www/lib/leaflet/leaflet.css"; fi
          if [ -f www/icons/rectangle-navigation-bateau.svg ]; then echo "OK www/icons/rectangle-navigation-bateau.svg"; else echo "ABSENT www/icons/rectangle-navigation-bateau.svg"; fi
          if [ -f www/data/export_2.js ]; then echo "OK www/data/export_2.js"; else echo "ABSENT www/data/export_2.js"; fi
          if [ -f www/data/export_3.js ]; then echo "OK www/data/export_3.js"; else echo "ABSENT www/data/export_3.js"; fi
          if [ -f www/data/SegmentationMarne_au_RhinMoselle_1.js ]; then echo "OK www/data/SegmentationMarne_au_RhinMoselle_1.js"; else echo "ABSENT www/data/SegmentationMarne_au_RhinMoselle_1.js"; fi
          if [ -f www/data/communes.geojson ]; then echo "OK www/data/communes.geojson"; else echo "ABSENT www/data/communes.geojson (executez node build-communes.mjs puis copiez le resultat)"; fi
          if [ -f www/vnfDataset.js ]; then echo "OK www/vnfDataset.js"; else echo "ABSENT www/vnfDataset.js"; fi
          if [ -f www/data/VNF_NordEst_Rhin_dataset.json ]; then echo "OK www/data/VNF_NordEst_Rhin_dataset.json"; else echo "ABSENT www/data/VNF_NordEst_Rhin_dataset.json"; fi
          echo
          echo "Cette etape ne bloque pas le build : elle sert uniquement au diagnostic."

      - name: Install dependencies
        run: npm ci

      - name: Prepare web directory
        run: npm run prepare-www

      - name: Add Android platform when missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Le dossier android existe deja."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy web assets explicitly
        run: npx cap copy android

      - name: Verify Android web assets
        shell: bash
        run: |
          public=android/app/src/main/assets/public
          echo "Verification des ressources copiees dans Android :"
          if [ -f "$public/index.html" ]; then echo "OK $public/index.html"; else echo "ABSENT $public/index.html"; fi
          if [ -f "$public/app.js" ]; then echo "OK $public/app.js"; else echo "ABSENT $public/app.js"; fi
          if [ -f "$public/communeResolver.js" ]; then echo "OK $public/communeResolver.js"; else echo "ABSENT $public/communeResolver.js"; fi
          if [ -f "$public/icons/rectangle-navigation-bateau.svg" ]; then echo "OK $public/icons/rectangle-navigation-bateau.svg"; else echo "ABSENT $public/icons/rectangle-navigation-bateau.svg"; fi
          if [ -f "$public/data/export_2.js" ]; then echo "OK $public/data/export_2.js"; else echo "ABSENT $public/data/export_2.js"; fi
          if [ -f "$public/data/export_3.js" ]; then echo "OK $public/data/export_3.js"; else echo "ABSENT $public/data/export_3.js"; fi
          if [ -f "$public/data/SegmentationMarne_au_RhinMoselle_1.js" ]; then echo "OK $public/data/SegmentationMarne_au_RhinMoselle_1.js"; else echo "ABSENT $public/data/SegmentationMarne_au_RhinMoselle_1.js"; fi
          if [ -f "$public/data/communes.geojson" ]; then echo "OK $public/data/communes.geojson"; else echo "ABSENT $public/data/communes.geojson"; fi
          if [ -f www/vnfDataset.js ]; then echo "OK www/vnfDataset.js"; else echo "ABSENT www/vnfDataset.js"; fi
          if [ -f www/data/VNF_NordEst_Rhin_dataset.json ]; then echo "OK www/data/VNF_NordEst_Rhin_dataset.json"; else echo "ABSENT www/data/VNF_NordEst_Rhin_dataset.json"; fi
          echo
          echo "Cette etape ne bloque pas le build : elle sert uniquement au diagnostic."

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sig-poche-uti-cmre-en-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
