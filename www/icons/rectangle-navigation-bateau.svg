<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Rectangle de navigation avec bateau</title>
  <desc id="desc">Coupe pédagogique montrant un bateau flottant dans le chenal, le tirant d'air, le tirant d'eau, le mouillage cible, le pied de pilote et la hauteur libre.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1e6ea0"/></marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#e67e22"/></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8e44ad"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2c7873"/></marker>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8bd0ed"/><stop offset="1" stop-color="#4ea7ce"/></linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#233c4d"/><stop offset="1" stop-color="#081d2c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".25"/></filter>
  </defs>

  <!-- Fond / chenal -->
  <rect width="900" height="560" fill="#fffaf0"/>
  <rect x="0" y="290" width="900" height="135" fill="url(#water)"/>
  <rect x="0" y="425" width="900" height="135" fill="#d89a70" opacity=".55"/>
  <path d="M0 425 H900" stroke="#704735" stroke-width="2"/>
  <path d="M0 472 C150 450 300 490 450 468 S750 450 900 475" fill="none" stroke="#9d684e" stroke-width="4" opacity=".65"/>
  <path d="M0 505 C180 485 320 525 500 500 S760 490 900 510" fill="none" stroke="#9d684e" stroke-width="3" opacity=".5"/>
  <text x="450" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#835b23">Chenal de navigation</text>

  <!-- Rectangle de navigation -->
  <rect x="205" y="95" width="490" height="330" fill="none" stroke="#f0c900" stroke-width="4" stroke-dasharray="13 9"/>
  <text x="450" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#a58700">Rectangle de navigation</text>

  <!-- Hauteur libre / ouvrage aérien -->
  <path d="M160 112 V205 M740 112 V205" stroke="#c0392b" stroke-width="4"/>
  <path d="M145 112 H755" stroke="#5b3a29" stroke-width="10"/>
  <path d="M155 122 H745" stroke="#92735e" stroke-width="3"/>
  <line x1="760" y1="112" x2="760" y2="290" stroke="#c0392b" stroke-width="3" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="775" y="194" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#c0392b">Hauteur libre</text>

  <!-- Bateau : coque, cabine, timonerie et mât -->
  <g filter="url(#shadow)">
    <!-- tirant d'air / superstructure -->
    <rect x="353" y="145" width="194" height="22" rx="5" fill="#d5a52a" stroke="#132c3c" stroke-width="4"/>
    <rect x="330" y="167" width="240" height="26" rx="5" fill="#edf1f2" stroke="#132c3c" stroke-width="4"/>
    <rect x="345" y="193" width="210" height="42" rx="4" fill="#f5f7f8" stroke="#132c3c" stroke-width="4"/>
    <path d="M350 194 L382 174 H518 L550 194 Z" fill="#19394d" stroke="#132c3c" stroke-width="4"/>
    <!-- hublots -->
    <circle cx="380" cy="212" r="7" fill="#48a2c8" stroke="#132c3c" stroke-width="2"/>
    <circle cx="409" cy="212" r="7" fill="#48a2c8" stroke="#132c3c" stroke-width="2"/>
    <circle cx="438" cy="212" r="7" fill="#48a2c8" stroke="#132c3c" stroke-width="2"/>
    <circle cx="467" cy="212" r="7" fill="#48a2c8" stroke="#132c3c" stroke-width="2"/>
    <circle cx="496" cy="212" r="7" fill="#48a2c8" stroke="#132c3c" stroke-width="2"/>
    <!-- coque -->
    <path d="M265 235 H635 L608 335 Q600 365 570 377 H330 Q300 365 292 335 Z" fill="url(#hull)" stroke="#071824" stroke-width="5"/>
    <path d="M280 248 H620" stroke="#fff" stroke-width="5" opacity=".8"/>
    <!-- ligne de flottaison -->
    <path d="M292 290 H608" stroke="#1b668b" stroke-width="5"/>
  </g>

  <!-- repère plan d'eau -->
  <path d="M0 290 H900" stroke="#0b2e45" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="42" y="282" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0b2e45">Plan d'eau</text>

  <!-- Tirant d'air -->
  <line x1="245" y1="115" x2="245" y2="290" stroke="#e67e22" stroke-width="4" marker-start="url(#arrowOrange)" marker-end="url(#arrowOrange)"/>
  <text x="42" y="175" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#e67e22">Tirant d'air</text>
  <text x="42" y="199" font-family="Arial,sans-serif" font-size="16" fill="#e67e22">partie émergée</text>

  <!-- Tirant d'eau -->
  <line x1="675" y1="290" x2="675" y2="365" stroke="#1e6ea0" stroke-width="4" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="700" y="326" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1e6ea0">Tirant d'eau</text>
  <text x="700" y="349" font-family="Arial,sans-serif" font-size="16" fill="#1e6ea0">coque immergée</text>

  <!-- Mouillage cible -->
  <line x1="125" y1="290" x2="125" y2="425" stroke="#2c7873" stroke-width="4" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <text x="30" y="376" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2c7873">Mouillage</text>
  <text x="30" y="400" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2c7873">cible</text>

  <!-- Pied de pilote -->
  <line x1="525" y1="365" x2="525" y2="425" stroke="#8e44ad" stroke-width="4" marker-start="url(#arrowPurple)" marker-end="url(#arrowPurple)"/>
  <text x="540" y="397" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#8e44ad">Pied de pilote</text>
  <text x="540" y="419" font-family="Arial,sans-serif" font-size="16" fill="#8e44ad">marge de sécurité</text>
</svg>
